  <script>
    /* Theme before first paint, so nothing flashes in the wrong one (H2, D-041/D-042). */
    (function () {
      var t = null;
      try { t = window.localStorage.getItem("statlab-theme"); } catch (e) { t = null; }
      if (t !== "light" && t !== "dark") {
        t = (window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches) ? "dark" : "light";
      }
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <link rel="stylesheet" href="../assets/css/theme.css">
  <link rel="stylesheet" href="../assets/css/components.css">
  <style>
    /* Runner-only styles; colors still come from tokens. */
    /* Status colour is a marker bar only; the words PASS/FAIL carry the meaning
       (--ok on --bg is 2.8:1, too low for text — D-016). */
    #summary {
      font-size: var(--fs-2); font-weight: 600; margin-bottom: var(--space-2);
      padding-left: var(--space-1); border-left: var(--border-strong) solid var(--line);
    }
    #summary.pass { border-color: var(--ok); }
    #summary.fail { border-color: var(--warn); }
    #results { list-style: none; padding: 0; margin: 0; }
    #results li {
      padding: var(--space-1);
      border-top: var(--border) solid var(--line);
      border-left: var(--border-strong) solid var(--line);
      font-family: var(--font-mono);
      font-size: var(--fs-0);
    }
    #results li.pass { border-left-color: var(--ok); }
    #results li.fail { border-left-color: var(--warn); }
    #results li::before { display: inline-block; width: 2.5rem; font-weight: 600; color: var(--ink); }
    #results li.pass::before { content: "PASS"; }
    #results li.fail::before { content: "FAIL"; }
    #results .detail { display: block; color: var(--ink-soft); margin-left: 2.5rem; }
  </style>
</head>
<body>
  <main>
    <h1>StatLab numeric tests</h1>
    <p class="muted">Every stats.js function is checked here against independently computed reference values (HANDBOOK §7.1). Reload to re-run.</p>
    <p id="summary" role="status" aria-live="polite">Running…</p>
    <ul id="results"></ul>
  </main>

  <!-- Harness. Classic (non-module) script so the page runs from file:// in every browser. -->
  <script>
    (function () {
      "use strict";
      var cases = [];

      /** Register a test. fn throws (via the assert helpers) to fail. */
      function test(name, fn) { cases.push({ name: name, fn: fn }); }

      var assert = {
        ok: function (cond, msg) {
          if (!cond) throw new Error(msg || "expected truthy");
        },
        equal: function (actual, expected, msg) {
          if (actual !== expected) {
            throw new Error((msg ? msg + ": " : "") + "expected " + expected + ", got " + actual);
          }
        },
        /** |actual − expected| ≤ tol. Default tol 1e-9 for closed forms (HANDBOOK §7.1). */
        close: function (actual, expected, tol, msg) {
          if (tol === undefined) tol = 1e-9;
          var ok = typeof actual === "number" && isFinite(actual) && Math.abs(actual - expected) <= tol;
          if (!ok) {
            throw new Error((msg ? msg + ": " : "") + "expected " + expected + " ± " + tol + ", got " + actual);
          }
        }
      };

      function run() {
        var list = document.getElementById("results");
        var summary = document.getElementById("summary");
        var passed = 0;
        cases.forEach(function (c) {
          var li = document.createElement("li");
          try {
            c.fn(assert);
            li.className = "pass";
            li.textContent = c.name;
            passed += 1;
          } catch (err) {
            li.className = "fail";
            li.textContent = c.name;
            var detail = document.createElement("span");
            detail.className = "detail";
            detail.textContent = err && err.message ? err.message : String(err);
            li.appendChild(detail);
          }
          list.appendChild(li);
        });
        var allPass = passed === cases.length;
        summary.textContent = passed + " / " + cases.length + " passed";
        summary.className = allPass ? "pass" : "fail";
        document.title = (allPass ? "✓ " : "✗ ") + summary.textContent + " — StatLab tests";
      }

      window.StatLabTests = { test: test, assert: assert, run: run };
      window.addEventListener("DOMContentLoaded", run);
    })();
  </script>

  <script>
    document.addEventListener("DOMContentLoaded", function () {
      StatLabTests.test("harness: 1 + 1 equals 2", function (assert) {
        assert.equal(1 + 1, 2);
      });
    });
  </script>
